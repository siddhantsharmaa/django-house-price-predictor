<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>House Price Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 
        FONTS: 
        - "Source Serif 4" → Brand name (formal, elegant — Amazon style serif)
        - "Source Sans 3"  → Body text (clean, readable — professional sans-serif)
    -->
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Icons CDN — <head> mein add karo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        /* ─── COLOR VARIABLES (same as before) ─── */

        :root {
            --navy: #0b1f3a;
            --gold: #c8a84b;
            --gold-lt: #e8cc7e;
            --cream: #f8f4ee;
            --slate: #4a5f7a;
        }

        /* ─── GLOBAL ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            background: var(--cream);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--navy);
            line-height: 1.55;
            margin: 0;
        }

        /* ══════════════════════════════════════════
           NAVBAR  
        ══════════════════════════════════════════ */
        .navbar {
            background: var(--navy);
            padding-top: 0;
            padding-bottom: 0;
            min-height: 52px;
            /* was too tall before → now 52px */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        /* Brand */
        .navbar-brand {
            font-family: 'Source Serif 4', serif;
            font-size: 15px;
            font-weight: 700;
            color: #fff !important;
            letter-spacing: 0.3px;
            padding: 0;
            line-height: 52px;
            /* vertically centered inside navbar */
        }

        .navbar-brand span {
            color: var(--gold);
        }

        /* Nav list */
        .navbar-nav {
            gap: 0;
            align-items: stretch;
        }

        /* Nav links */
        .nav-link {
            color: rgba(255, 255, 255, 0.78) !important;
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 500;
            font-size: 12.5px;
            letter-spacing: 0.2px;
            padding: 0 14px !important;
            line-height: 52px;
            position: relative;
            transition: color 0.2s;
            white-space: nowrap;
        }

        /* Gold underline effect */
        .nav-link::after {
            content: '';
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 8px;
            height: 2px;
            background: var(--gold);
            transform: scaleX(0);
            transition: transform 0.22s ease;
            border-radius: 2px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--gold) !important;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            transform: scaleX(1);
        }

        /* Toggler (mobile) */
        .navbar-toggler {
            background: var(--gold);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            margin: 8px 0;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            filter: brightness(0);
            width: 16px;
            height: 16px;
        }

        /* ══════════════════════════════════════════
           MAIN CONTENT
        ══════════════════════════════════════════ */
        .page-wrapper {
            min-height: calc(100vh - 52px - 180px);
            padding: 10px 0;
        }

        /* ═════════════════════════════════════════
           FOOTER 
        ══════════════════════════════════════════ */
        footer {
            background: var(--navy);
            color: rgba(255, 255, 255, 0.62);
            padding: 28px 0 0;
            /* less padding = less height */
        }

        footer h6 {
            font-family: 'Source Serif 4', serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        footer p {
            font-size: 12.5px;
            margin-bottom: 4px;
            line-height: 1.6;
        }

        footer a {
            color: rgba(255, 255, 255, 0.62);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--gold);
        }

        /* Thin gold divider */
        .footer-divider {
            border: none;
            border-top: 1px solid rgba(200, 168, 75, 0.18);
            margin: 20px 0 0;
        }

        .footer-bottom {
            padding: 10px 0;
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
        }

        /* ══════════════════════════════════════════
           ANIMATION 
        ══════════════════════════════════════════ */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ══════════════════════════════════════════
           MOBILE
        ══════════════════════════════════════════ */
        @media (max-width: 991px) {
            .navbar-collapse {
                background: var(--navy);
                padding: 6px 0 10px;
                border-top: 1px solid rgba(200, 168, 75, 0.15);
            }

            .nav-link {
                line-height: 1;
                padding: 9px 16px !important;
            }

            .nav-link::after {
                bottom: 4px;
            }
        }

        @media (max-width: 768px) {
            .carousel-caption h1 {
                font-size: 28px;
            }

            .carousel-caption p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- ─── NAVBAR ─── -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🏠
                House <span>Price</span> Predictor
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <!-- ─── MAIN CONTENT ─── -->
    <main class="page-wrapper">
        <div class="container">
            {% block main %}
            {% endblock main %}
        </div>
    </main>
    <!-- ─── FOOTER ─── -->
    <footer id="history">
        <div class="container">
            <div class="row gy-3">

                <div class="col-lg-4 col-md-6">
                    <h6>House Price Predictor</h6>
                    <p>Smart ML-based house price prediction web application.</p>
                </div>

                <div class="col-lg-4 col-md-6">
                    <h6>Quick Links</h6>
                    <p><a href="{% url 'home' %}">Home</a></p>
                    <p><a href="{% url 'about' %}">About Us</a></p>
                </div>

                <div class="col-lg-4 col-md-12">
                    <h6>Contact</h6>
                    <p>Phone: 7081816792</p>
                    <p>Email: <a href="mailto:si.sharma.me@gmail.com">si.sharma.me@gmail.com</a></p>
                </div>

            </div>

            <hr class="footer-divider">

            <div class="footer-bottom" style="display:flex; justify-content:space-between; align-items:center;">

                <!-- Copyright -->
                <span>© 2026 House Price Predictor. All Rights Reserved.</span>

                <!-- ✅ Admin link — thoda visible -->
                <a href="{% url 'admin_login' %}" style="font-size:16px;
              color:rgba(255,255,255,0.45);
              text-decoration:none;
              transition: color 0.2s;" onmouseover="this.style.color='#c8a84b'"
                    onmouseout="this.style.color='rgba(255,255,255,0.45)'">
                    <i class="bi bi-shield-lock"></i>
                </a>

            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
